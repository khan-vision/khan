name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: khan
          POSTGRES_PASSWORD: khan
          POSTGRES_DB: khan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khan" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KHAN_TEST_DB_HOST: 127.0.0.1
      KHAN_TEST_DB_DATABASE: khan_test
      KHAN_TEST_DB_USERNAME: khan
      KHAN_TEST_DB_PASSWORD: khan
      KHAN_TEST_DB_EXTRA: sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
